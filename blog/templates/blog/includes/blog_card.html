{% load wagtailcore_tags wagtailimages_tags %}

<article>
    <h2 class="text-2xl font-serif font-semibold mb-2">
        <a href="{% pageurl post %}" class="hover:text-amber-700">{{ post.title }}</a>
    </h2>
    <p class="text-sm uppercase tracking-wider text-stone-500 mb-3">
        <time datetime="{{ post.date|date:'c' }}">{{ post.date|date:"j \\d\\e F \\d\\e Y" }}</time>
    </p>
    {% if post.intro %}
        <p class="text-stone-700 mb-3">{{ post.intro }}</p>
    {% endif %}
    {% if post.tag_list %}
        <p class="flex flex-wrap gap-2 text-xs">
            {% for tag in post.tag_list %}
                <span class="px-2 py-1 rounded-full bg-stone-200">{{ tag.name }}</span>
            {% endfor %}
        </p>
    {% endif %}
</article>
